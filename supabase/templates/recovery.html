<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your PITCON password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #fafafa; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background-color: #ffffff;
              border: 1px solid #e5e5e5;
              border-radius: 14px;
              padding: 40px 32px;
            "
          >
            <tr>
              <td style="padding-bottom: 24px">
                <span style="font-size: 20px; font-weight: 700; color: #171717">
                  Pit<span style="color: #7634c8">con</span>
                </span>
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 20px;
                  font-weight: 600;
                  color: #171717;
                  padding-bottom: 12px;
                "
              >
                Reset your password
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 15px;
                  line-height: 1.6;
                  color: #525252;
                  padding-bottom: 24px;
                "
              >
                We received a request to reset the password for your PITCON
                account ({{ .Email }}). Choose a new password to continue.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}"
                  style="
                    display: inline-block;
                    background-color: #7634c8;
                    color: #ffffff;
                    font-size: 14px;
                    font-weight: 600;
                    text-decoration: none;
                    padding: 12px 24px;
                    border-radius: 8px;
                  "
                  >Reset password</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 13px;
                  line-height: 1.5;
                  color: #a3a3a3;
                  padding-bottom: 8px;
                "
              >
                This link expires in 1 hour. If you didn't request a
                password reset, you can safely ignore this email: your
                password won't be changed.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
